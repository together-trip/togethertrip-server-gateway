services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: together_trip
      POSTGRES_USER: together_trip
      POSTGRES_PASSWORD: together_trip
    ports:
      - "5432:5432"
    volumes:
      - together-trip-postgres:/var/lib/postgresql/data
      - ./docker/postgres/local-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U together_trip -d together_trip"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  main:
    build:
      context: ../togethertrip-server-main
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/together_trip
      SPRING_DATASOURCE_USERNAME: together_trip
      SPRING_DATASOURCE_PASSWORD: together_trip
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: local-development-secret-key-at-least-32-bytes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  notification:
    build:
      context: ../togethertrip-server-notification
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/together_trip_notification
      SPRING_DATASOURCE_USERNAME: together_trip
      SPRING_DATASOURCE_PASSWORD: together_trip
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"

  chat:
    build:
      context: ../togethertrip-server-chat
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/together_trip
      SPRING_DATASOURCE_USERNAME: together_trip
      SPRING_DATASOURCE_PASSWORD: together_trip
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"

  gateway:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: local-development-secret-key-at-least-32-bytes
    depends_on:
      - main
      - notification
      - chat
    ports:
      - "8080:8080"

volumes:
  together-trip-postgres:
