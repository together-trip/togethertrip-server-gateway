spring:
  application:
    name: gateway

  profiles:
    default: local

  cloud:
    gateway:
      routes:
        - id: main
          uri: http://main:8081
          predicates:
            - Path=/api/**
        - id: notification
          uri: http://notification:8082
          predicates:
            - Path=/notification/**
        - id: chat
          uri: http://chat:8083
          predicates:
            - Path=/chat/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
  issuer: together-trip
  access-token-expiration: 1800
  refresh-token-expiration: 1209600
