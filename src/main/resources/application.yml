spring:
  application:
    name: gateway

  profiles:
    default: local

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: main
              uri: ${MAIN_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
            - id: uploads-static
              uri: ${MAIN_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/uploads/post-attachments/**,/uploads/user-profile-images/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/notification/**
            - id: chat
              uri: ${CHAT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/chat/**

server:
  port: 8080
  forward-headers-strategy: none

gateway:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
  trusted-proxy:
    cidrs:
      - 127.0.0.1/32
      - "::1/128"
  transport-security:
    require-https: false
  rate-limit:
    enabled: true
    login-requests-per-minute: 20
    report-requests-per-minute: 5
    max-tracked-keys: 20000

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
  issuer: together-trip
  access-token-expiration: 1800
  refresh-token-expiration: 1209600
