spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: main
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/**
            - id: uploads-static
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/uploads/post-attachments/**,/uploads/user-profile-images/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/notification/**
            - id: chat
              uri: ${CHAT_SERVICE_URL}
              predicates:
                - Path=/chat/**

server:
  # 애플리케이션의 trusted proxy transformer가 forwarded header를 선별 처리한다.
  forward-headers-strategy: none

gateway:
  security:
    public-paths:
      - /api/auth/oauth/kakao
      - /api/auth/oauth/apple
      - /api/auth/refresh
      - /api/terms
      - /api/users/nicknames/availability
      # 정산 공유 링크는 공유 토큰 자체가 접근 수단이라 인증을 요구하지 않는다.
      - /api/settlement-shares
      - /health
      - /actuator/health
    public-path-prefixes:
      - /uploads/post-attachments
      - /uploads/user-profile-images
  cors:
    # 쉼표로 구분한 명시적 HTTPS origin 목록. wildcard는 시작 시 거부한다.
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS}
    require-https-origins: true
  trusted-proxy:
    # Gateway에 직접 연결하는 load balancer/ingress의 IPv4/IPv6 CIDR 목록.
    cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS}
  transport-security:
    require-https: true
  rate-limit:
    enabled: true
    login-requests-per-minute: ${GATEWAY_LOGIN_RATE_LIMIT_PER_MINUTE:20}
    report-requests-per-minute: ${GATEWAY_REPORT_RATE_LIMIT_PER_MINUTE:5}
    settlement-share-requests-per-minute: ${GATEWAY_SETTLEMENT_SHARE_RATE_LIMIT_PER_MINUTE:60}
    max-tracked-keys: ${GATEWAY_RATE_LIMIT_MAX_TRACKED_KEYS:20000}

auth:
  local-test:
    enabled: false
