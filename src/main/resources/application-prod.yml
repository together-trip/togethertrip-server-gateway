spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: main
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/api/**
            - id: uploads-static
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/uploads/post-attachments/**,/uploads/user-profile-images/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/notification/**
            - id: chat
              uri: ${CHAT_SERVICE_URL}
              predicates:
                - Path=/chat/**

auth:
  local-test:
    enabled: false
